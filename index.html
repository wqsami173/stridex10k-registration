<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StrideX Bangladesh</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #f6f9fc 0%, #eef2f5 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 1.5rem;
    }

    .card {
      max-width: 860px;
      width: 100%;
      background: #ffffff;
      border-radius: 2.5rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      padding: 2.5rem 2.2rem;
      transition: all 0.2s ease;
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #0b1b2f;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.75rem;
      border-bottom: 2px solid #e9edf2;
      padding-bottom: 1rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      font-weight: 500;
      font-size: 0.9rem;
      color: #1f2a3e;
      margin-bottom: 0.4rem;
      letter-spacing: 0.01em;
    }

    label .required {
      color: #b22234;
      margin-left: 2px;
    }

    input, select {
      width: 100%;
      padding: 0.75rem 1rem;
      font-size: 1rem;
      border: 1.5px solid #dce1e9;
      border-radius: 1.25rem;
      background: #fbfdff;
      transition: 0.2s;
      color: #0b1b2f;
      font-weight: 450;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #2b6c9e;
      box-shadow: 0 0 0 4px rgba(43, 108, 158, 0.15);
      background: #ffffff;
    }

    .radio-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 2rem;
      background: #f2f6fb;
      padding: 0.6rem 1.2rem;
      border-radius: 2rem;
    }

    .radio-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 450;
      color: #1f2a3e;
      cursor: pointer;
    }

    .radio-item input[type="radio"] {
      width: auto;
      accent-color: #1f4e7a;
      transform: scale(1.05);
      flex-shrink: 0;
    }

    /* ----- EVENT CARDS - STANDARDIZED (2 cards) ----- */
    .event-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.2rem;
      margin-top: 0.25rem;
    }

    .event-card {
      background: #f4f8fe;
      border-radius: 1.5rem;
      padding: 0.8rem 0.8rem 0.7rem 0.8rem;
      border: 2px solid transparent;
      transition: 0.15s ease;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      min-width: 0;
    }

    .event-card.selected {
      border-color: #1f5a8a;
      background: #e5effa;
      box-shadow: 0 4px 10px rgba(31, 90, 138, 0.12);
    }

    .event-card .img-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 1.2rem;
      overflow: hidden;
      background: #d9e3ef;
      margin-bottom: 0.5rem;
      flex-shrink: 0;
    }

    .event-card .img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .event-card .event-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      font-weight: 600;
      color: #1a2c44;
      font-size: 0.9rem;
      width: 100%;
      padding: 0.1rem 0;
      flex-wrap: wrap;
    }

    .event-card input[type="checkbox"] {
      width: 1.1rem;
      height: 1.1rem;
      accent-color: #1f5a8a;
      margin: 0;
      flex-shrink: 0;
      border-radius: 5px;
      cursor: pointer;
    }

    .event-card .price-tag {
      font-size: 0.7rem;
      background: #dce6f2;
      padding: 0.12rem 0.7rem;
      border-radius: 20px;
      color: #0b2b44;
      font-weight: 500;
      margin-top: 0.15rem;
      white-space: nowrap;
    }

    /* discount badge */
    .discount-badge {
      background: #e9f0e9;
      color: #0f4d2e;
      font-weight: 600;
      font-size: 0.75rem;
      padding: 0.2rem 0.9rem;
      border-radius: 30px;
      display: inline-block;
      margin-left: 0.4rem;
      border: 1px solid #b2d0b2;
    }

    .price-box {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      background: #f2f7ff;
      border-radius: 2.5rem;
      padding: 0.8rem 1.8rem;
      margin: 0.5rem 0 1rem;
    }

    .total-amount {
      font-weight: 700;
      font-size: 1.6rem;
      color: #023047;
    }

    .btn-submit {
      background: #0b2b44;
      border: none;
      color: white;
      font-weight: 600;
      font-size: 1.2rem;
      padding: 0.9rem 1.8rem;
      border-radius: 3rem;
      width: 100%;
      cursor: pointer;
      transition: 0.15s;
      letter-spacing: 0.3px;
      margin-top: 1rem;
      border: 1px solid #1a3f5c;
      box-shadow: 0 6px 0 #061a2b;
      transform: translateY(-2px);
    }

    .btn-submit:hover {
      background: #12406b;
      transform: translateY(-3px);
      box-shadow: 0 8px 0 #061a2b;
    }

    .btn-submit:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #061a2b;
    }

    .student-id-wrapper {
      display: none;
      margin-top: 0.2rem;
      padding: 0.75rem 1rem 0.25rem 1rem;
      background: #f0f6fe;
      border-radius: 1.8rem;
      border: 1px dashed #2b6c9e;
      transition: 0.2s;
    }

    .student-id-wrapper.visible {
      display: block;
    }

    .student-id-wrapper input[type="file"] {
      border: 1px solid #b8cee6;
      background: white;
      padding: 0.6rem 0.8rem;
      border-radius: 2rem;
      font-size: 0.9rem;
      margin-top: 0.3rem;
    }

    .file-hint {
      font-size: 0.8rem;
      color: #3d6184;
      font-weight: 400;
    }

    @media (max-width: 700px) {
      .event-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.8rem;
      }
      .event-card .event-label {
        font-size: 0.75rem;
        gap: 0.2rem;
      }
      .event-card input[type="checkbox"] {
        width: 0.95rem;
        height: 0.95rem;
      }
      .event-card .price-tag {
        font-size: 0.6rem;
        padding: 0.08rem 0.5rem;
      }
    }

    @media (max-width: 500px) {
      .card { padding: 1.5rem; }
      .event-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.5rem;
      }
      .event-card {
        padding: 0.5rem 0.4rem 0.5rem 0.4rem;
        border-radius: 1rem;
      }
      .event-card .img-wrapper {
        border-radius: 0.8rem;
      }
      .event-card .event-label {
        font-size: 0.65rem;
      }
      .event-card input[type="checkbox"] {
        width: 0.8rem;
        height: 0.8rem;
      }
      .event-card .price-tag {
        font-size: 0.5rem;
        padding: 0.05rem 0.4rem;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>📋 StrideX Registration</h1>

    <form id="registrationForm">
      <!-- Name -->
      <div class="form-group">
        <label for="fullName">Full Name <span class="required">*</span></label>
        <input type="text" id="fullName" required>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email address <span class="required">*</span></label>
        <input type="email" id="email" required>
      </div>

      <!-- Phone -->
      <div class="form-group">
        <label for="phone">Phone / WhatsApp <span class="required">*</span></label>
        <input type="tel" id="phone" required>
      </div>

      <!-- Category -->
      <div class="form-group">
        <label>Category <span class="required">*</span></label>
        <div class="radio-group" id="categoryGroup">
          <label class="radio-item">
            <input type="radio" name="category" value="student" checked> 🎓 Student
          </label>
          <label class="radio-item">
            <input type="radio" name="category" value="regular"> 👤 Regular
          </label>
        </div>
      </div>

      <!-- Student ID -->
      <div class="form-group student-id-wrapper visible" id="studentIdWrapper">
        <label for="studentIdFile">
          🪪 Student ID Card Photo <span class="required">*</span>
          <span class="file-hint">(jpg, png, pdf, max 5MB)</span>
        </label>
        <input type="file" id="studentIdFile" accept=".jpg,.jpeg,.png,.pdf">
      </div>

      <!-- Gender -->
      <div class="form-group">
        <label>Gender <span class="required">*</span></label>
        <div class="radio-group">
          <label class="radio-item">
            <input type="radio" name="gender" value="male" checked> Male
          </label>
          <label class="radio-item">
            <input type="radio" name="gender" value="female"> Female
          </label>
        </div>
      </div>

      <!-- EVENTS - only Season 1 & Season 2 (Curzon removed) -->
      <div class="form-group">
        <label>Select Events <span class="required">*</span>
          <span class="discount-badge">✨ 100৳ off when you choose both!</span>
        </label>
        <div class="event-grid" id="eventGrid">
          <!-- Season 1 -->
          <div class="event-card selected" data-event="event1">
            <div class="img-wrapper">
              <img src="S1.jpeg" alt="Season 1">
            </div>
            <div class="event-label">
              <input type="checkbox" id="event1" value="event1" checked>
              <span>StrideX 10K Season 1</span>
            </div>
            <div class="price-tag">Stu 599 / Reg 649</div>
          </div>

          <!-- Season 2 -->
          <div class="event-card" data-event="event2">
            <div class="img-wrapper">
              <img src="S2.png" alt="Season 2">
            </div>
            <div class="event-label">
              <input type="checkbox" id="event2" value="event2">
              <span>StrideX 10K Season 2</span>
            </div>
            <div class="price-tag">Stu 599 / Reg 649</div>
          </div>
        </div>
        <div style="font-size:0.8rem; color:#3d6184; margin-top:0.3rem;">Select both events to get 100৳ discount.</div>
      </div>

      <!-- Total -->
      <div class="price-box">
        <span style="font-weight: 500; color: #1f3a57;">Total Amount</span>
        <span class="total-amount" id="totalDisplay">649 ৳</span>
      </div>

      <!-- Payment -->
      <div class="form-group">
        <label for="paymentMethod">Payment Method <span class="required">*</span></label>
        <select id="paymentMethod">
          <option value="bkash">Bkash — 01624577374</option>
          <option value="nagad">Nagad — 01687414286</option>
          <option value="rocket">Rocket — 01624577374</option>
        </select>
      </div>

      <div class="form-group">
        <label for="personalNumber">Your Bkash / Nagad / Rocket Number <span class="required">*</span></label>
        <input type="text" id="personalNumber" required>
      </div>

      <div class="form-group">
        <label for="transactionId">Transaction ID <span class="required">*</span></label>
        <input type="text" id="transactionId" required>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">Register now</button>
    </form>
    <div class="footnote"></div>
  </div>

  <script>
    (function() {
      const form = document.getElementById('registrationForm');
      const totalDisplay = document.getElementById('totalDisplay');

      const categoryRadios = document.querySelectorAll('input[name="category"]');
      const event1 = document.getElementById('event1');
      const event2 = document.getElementById('event2');
      const studentIdWrapper = document.getElementById('studentIdWrapper');
      const studentIdFile = document.getElementById('studentIdFile');
      const eventCards = document.querySelectorAll('.event-card');

      // DISCOUNT: 100 tk when both events selected
      const DISCOUNT = 100;

      function getCategory() {
        for (let radio of categoryRadios) {
          if (radio.checked) return radio.value;
        }
        return 'student';
      }

      function toggleStudentIdField() {
        const category = getCategory();
        if (category === 'student') {
          studentIdWrapper.classList.add('visible');
          studentIdFile.setAttribute('required', 'required');
        } else {
          studentIdWrapper.classList.remove('visible');
          studentIdFile.removeAttribute('required');
        }
      }

      function calculateTotal() {
        const category = getCategory();
        const e1 = event1.checked;
        const e2 = event2.checked;

        const prices = {
          student: { event1: 599, event2: 599 },
          regular: { event1: 649, event2: 649 }
        };

        const catPrices = prices[category] || prices.student;
        let total = 0;
        if (e1) total += catPrices.event1;
        if (e2) total += catPrices.event2;

        // apply discount if both selected
        if (e1 && e2) {
          total = Math.max(0, total - DISCOUNT);
        }
        return total;
      }

      function updateTotal() {
        const total = calculateTotal();
        if (total === 0) {
          totalDisplay.textContent = '0 ৳ (Select Event)';
        } else {
          totalDisplay.textContent = total + ' ৳';
        }

        // highlight selected cards
        eventCards.forEach(card => {
          const cb = card.querySelector('input[type="checkbox"]');
          if (cb && cb.checked) {
            card.classList.add('selected');
          } else {
            card.classList.remove('selected');
          }
        });
      }

      function attachEvents() {
        categoryRadios.forEach(radio => {
          radio.addEventListener('change', function() {
            toggleStudentIdField();
            updateTotal();
          });
        });

        event1.addEventListener('change', updateTotal);
        event2.addEventListener('change', updateTotal);

        // click on card toggles checkbox
        eventCards.forEach(card => {
          card.addEventListener('click', function(e) {
            if (e.target.tagName === 'INPUT') return;
            const cb = this.querySelector('input[type="checkbox"]');
            if (cb) {
              cb.checked = !cb.checked;
              const evt = new Event('change', { bubbles: true });
              cb.dispatchEvent(evt);
              updateTotal();
            }
          });
        });

        toggleStudentIdField();
        updateTotal();
      }

      async function handleSubmit(e) {
        e.preventDefault();
        const submitBtn = document.getElementById('submitBtn');

        const name = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const category = getCategory();
        const gender = document.querySelector('input[name="gender"]:checked')?.value || '';
        const paymentMethod = document.getElementById('paymentMethod').value;
        const personalNumber = document.getElementById('personalNumber').value.trim();
        const transactionId = document.getElementById('transactionId').value.trim();

        const selectedEvents = [];
        if (event1.checked) selectedEvents.push('event1');
        if (event2.checked) selectedEvents.push('event2');

        if (!name || !email || !phone || !personalNumber || !transactionId) {
          alert('⚠️ Please fill all required fields.');
          return;
        }
        if (selectedEvents.length === 0) {
          alert('⚠️ Please select at least one event.');
          return;
        }

        if (category === 'student') {
          const file = studentIdFile.files[0];
          if (!file) {
            alert('⚠️ Student category requires a Student ID card.');
            return;
          }
          const allowedTypes = ['image/jpeg', 'image/png', 'application/pdf'];
          if (!allowedTypes.includes(file.type)) {
            alert('⚠️ Please upload a JPG, PNG, or PDF file.');
            return;
          }
          if (file.size > 5 * 1024 * 1024) {
            alert('⚠️ Student ID must be less than 5MB.');
            return;
          }
        }

        const formData = new FormData();
        formData.append('fullName', name);
        formData.append('email', email);
        formData.append('phone', phone);
        formData.append('category', category);
        formData.append('gender', gender);
        formData.append('events', JSON.stringify(selectedEvents));
        formData.append('paymentMethod', paymentMethod);
        formData.append('personalNumber', personalNumber);
        formData.append('transactionId', transactionId);
        if (category === 'student') {
          formData.append('studentId', studentIdFile.files[0]);
        }

        try {
          submitBtn.disabled = true;
          submitBtn.textContent = 'Registering...';
          const response = await fetch('/api/register', {
            method: 'POST',
            body: formData
          });
          const result = await response.json();
          if (result.success) {
            alert(
              `✅ Registration Successful!\n\n` +
              `Registration ID: ${result.registrationId}\n` +
              `Amount: ${result.amount} ৳\n\n` +
              `Your registration is pending verification.`
            );
            form.reset();
            // reset checkboxes: keep event1 checked (default) and event2 unchecked
            event1.checked = true;
            event2.checked = false;
            toggleStudentIdField();
            updateTotal();
          } else {
            alert('❌ Registration failed:\n\n' + (result.message || 'Please try again.'));
          }
        } catch (error) {
          console.error('Registration error:', error);
          alert('❌ Could not connect to the server.\n\nPlease make sure the StrideX backend is running.');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Register now';
        }
      }

      function init() {
        attachEvents();
        form.addEventListener('submit', handleSubmit);
      }

      window.addEventListener('DOMContentLoaded', init);
    })();
  </script>
</body>
</html>
